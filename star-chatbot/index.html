<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스타 | STAR</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="landing">
  <div class="landing-top" id="landingTop">
    <div class="star" aria-hidden="true"></div>
    <h1 class="landing-text">스타에게<br>무엇이든 질문해 보세요</h1>
  </div>

  <div class="results" id="results" hidden></div>

  <form class="prompt-form" id="promptForm">
    <input
      type="text"
      id="promptInput"
      class="prompt-input"
      placeholder="궁금한 것을 물어보세요..."
      autocomplete="off"
    >
    <button type="button" class="prompt-mic" id="micBtn" aria-label="음성 입력">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="2" width="6" height="12" rx="3"></rect>
        <path d="M5 10a7 7 0 0 0 14 0"></path>
        <line x1="12" y1="19" x2="12" y2="22"></line>
      </svg>
    </button>
    <button type="submit" class="prompt-send" aria-label="전송">➤</button>
  </form>
</main>

<script src="script.js"></script>
</body>
</html>
