<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스타 | STAR</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="landing">
  <div class="landing-top">
    <div class="star" aria-hidden="true"></div>
    <h1 class="landing-text">스타에게<br>무엇이든 질문해 보세요</h1>
  </div>

  <form class="prompt-form" id="promptForm">
    <input
      type="text"
      id="promptInput"
      class="prompt-input"
      placeholder="궁금한 것을 물어보세요..."
      autocomplete="off"
    >
    <button type="submit" class="prompt-send" aria-label="전송">➤</button>
  </form>
</main>

</body>
</html>
